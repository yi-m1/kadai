<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>じゃんけんゲーム</title>

	<!-- Bootstrap -->
	<!--    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet">-->
	<link rel="stylesheet" th:href="@{/css/base.css}">
	<link rel="stylesheet" th:href="@{/css/layout.css}">
	<link rel="stylesheet" th:href="@{/css/janken.css}">

	<!-- CSRF トークンをメタタグで埋め込む -->
	<meta name="_csrf" th:content="${_csrf.token}" />
	<meta name="_csrf_header" th:content="${_csrf.headerName}" />
</head>

<body>
	<div class="layout">
		<div id="overlay" class="overlay"></div>
		<div th:replace="fragments/sidebar :: sidebar"></div>

		<main class="janken-container">
			<h1>じゃんけんゲーム</h1>

			

				<div class="result-actions">
					<div class="result-text" id="result"></div>
					<div class="result-info" id="win-streak"></div>
				</div>
				
				<!-- CPUの手表示 -->
				<div class="opponent" id="cpu-hand" style="display:none;">
					<img class="opponent-img" id="cpu-hand-img" src="" alt="CPUの手">
				</div>

				<div class="direction-grid">
				<label class="direction-card">
					<input type="radio" name="hand" value="ROCK" id="ROCK" onclick="handleSelection('ROCK')">
					<span>✊</span>
					<small>グー</small>
				</label>

				<label class="direction-card">
					<input type="radio" name="hand" value="SCISSORS" id="SCISSORS"
						onclick="handleSelection('SCISSORS')">
					<span>✌️</span>
					<small>チョキ</small>
				</label>

				<label class="direction-card">
					<input type="radio" name="hand" value="PAPER" id="PAPER" onclick="handleSelection('PAPER')">
					<span>✋</span>
					<small>パー</small>
				</label>

			</div>

			<button class="btn" id="submit-button" onclick="playGame()">勝負!</button>

			<div class="result-actions">
				<button id="retry-button" style="display:none" onclick="retryGame()">もう一回</button>
				<form th:action="@{/menu}" method="get">
					<button id="exit-button" class="btn btn-secondary" style="display:none;">やめる</button>
				</form>
			</div>

		</main>
	</div>


	<script th:src="@{/js/janken.js}"></script>
	<script th:src="@{/js/sidebar.js}"></script>
</body>

</html>
