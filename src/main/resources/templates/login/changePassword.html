<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>パスワード再登録</title>
<style>
body, html {
	height: 100%;
	margin: 0;
	font-family: Arial, sans-serif;
}

.container {
	display: flex;
	flex-direction: column;
	align-items: center;       /* 横中央 */
	justify-content: flex-start; /* 上寄せ */
	height: 100%;
	text-align: center;
	padding-top: 50px;        /* 上から少しスペース */
}

input[type="text"], input[type="password"] {
	width: 300px;
	padding: 10px;
	font-size: 18px;
	margin-bottom: 10px;
	box-sizing: border-box;
}

button {
	padding: 10px 20px;
	font-size: 20px;
	cursor: pointer;
	display: block;
	margin: 10px auto; /* 中央寄せ */
}

.error {
	color: red;
	margin-bottom: 10px;
}
</style>
</head>
<body>
<div class="container">
	<h1>パスワード再登録</h1>

	<p th:if="${errorMessage}" th:text="${errorMessage}" class="error"></p>

	<form th:action="@{/changePassword}" th:object="${changePasswordForm}" method="post">
		<input type="text" th:field="*{userNameOrMailAddress}" placeholder="ユーザ名 or メールアドレス" required>
		<div th:if="${#fields.hasErrors('userNameOrMailAddress')}" th:errors="*{userNameOrMailAddress}" class="error"></div>
		<br>
		<input type="password" th:field="*{newPassword}" placeholder="新しいパスワード" required>
		<div th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" class="error"></div>
		<br>
		<input type="password" th:field="*{confirmPassword}" placeholder="新しいパスワード(確認用)" required>
		<div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="error"></div>

		<button type="submit">パスワードを更新してログイン</button>
	</form>
</div>
</body>
</html>
