<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ユーザ新規登録</title>
<style>
body, html {
	height: 100%;
	margin: 0;
	font-family: Arial, sans-serif;
}

.container {
	display: flex;
	flex-direction: column;
	align-items: center;       /* 横中央 */
	justify-content: flex-start; /* 上寄せ */
	height: 100%;
	text-align: center;
	padding-top: 50px;        /* 上から少しスペース */
}

input[type="text"], input[type="password"] {
	width: 300px;
	padding: 10px;
	font-size: 18px;
	margin-bottom: 10px;
	box-sizing: border-box;
}

button {
	padding: 10px 20px;
	font-size: 20px;
	cursor: pointer;
	display: block;
	margin: 10px auto; /* 中央寄せ */
}

.error {
	color: red;
	margin-bottom: 10px;
}
</style>
</head>
<body>
<div class="container">
	<h1>ユーザ新規登録</h1>

	<p th:if="${registerError}" th:text="${registerError}" class="error"></p>

	<form th:action="@{/register}" th:object="${registerForm}" method="post">
		<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

		<input type="text" th:field="*{userName}" placeholder="ユーザ名" required>
		<div th:if="${#fields.hasErrors('userName')}" th:errors="*{userName}" class="error"></div>
		<br>
		<input type="text" th:field="*{mailAddress}" placeholder="メールアドレス" required>
		<div th:if="${#fields.hasErrors('mailAddress')}" th:errors="*{mailAddress}" class="error"></div>
		<br>
		<input type="text" th:field="*{password}" placeholder="パスワード" required>
		<div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error"></div>

		<button type="submit">登録してログイン</button>
	</form>
</div>
</body>
</html>
