<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<title>あっちむいてほい</title>
</head>

<body>
	<div class="container">
		<h1>あっちむいてほい!</h1>

		<div class="opponent">
			<img th:src="@{/images/face_ready.png}" alt="対戦相手" class="opponent-img">
		</div>

		<form th:action="@{/look-over-there/play}" method="post">

			<div class="opponent">
				<img th:src="@{/images/finger_ready.png}" alt="指" class="finger-img">
			</div>

			<p>方向を選んでください</p>

			<div class="direction-buttons">

				<label class="direction-button">
					<input type="radio" name="direction" value="1" required>
					<span>↑</span>
				</label>

				<label class="direction-button">
					<input type="radio" name="direction" value="2">
					<span>↓</span>
				</label>

				<label class="direction-button">
					<input type="radio" name="direction" value="3">
					<span>←</span>
				</label>

				<label class="direction-button">
					<input type="radio" name="direction" value="4">
					<span>→</span>
				</label>

			</div>

			<button type="submit">勝負！</button>
		</form>

		<hr>

		<form th:action="@{/}" method="get">
			<button>トップへ戻る</button>
		</form>
	</div>

</body>

</html>
