<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head th:replace="common/head :: head_fragment(title = 'ユーザー情報一覧', scripts = ~{::script}, links = ~{::link})"></head>

<body>
	<div th:replace="fragments/sidebar :: sidebar"></div>

	<div class="container">
		<h1>ユーザー情報管理画面</h1>
		<form th:action="@{/user/search}" th:object="${userSearchRequest}" th:method="post">
			<div class="form-group">
				<label for="id">ID</label>
				<input type="text" class="w-25 form-control" th:field="*{id}">
				<label for="name">名前</label>
				<input type="text" class="w-50 form-control" th:field="*{name}">
			</div><br />
			<button type="submit" class="btn btn-primary">検索</button>
		</form>
		<div th:if="${userlist}">
			<table class="table table-striped">
				<thead>
					<tr>
						<th>ID</th>
						<th>名前</th>
						<th>メールアドレス</th>
						<th>ステータス</th>
						<th>更新日時</th>
						<th>登録日時</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="user : ${userlist}" th:object="${user}" class="align-middle">
						<td th:text="*{userId}"></td>
						<td th:text="*{userName}"></td>
						<td th:text="*{mailAddress}"></td>
						<td th:text="*{status}"></td>
						<td
							th:text="${user.updateDatetime != null} ? ${#temporals.format(user.updateDatetime, 'yyyy/MM/dd')} : ''">
						</td>
						<td
							th:text="${user.createDatetime != null} ? ${#temporals.format(user.createDatetime, 'yyyy/MM/dd')} : ''">
						</td>
						<td></td>
						<td>
							<a th:href="@{/user/{id}/edit(id=*{userId})}" class="btn btn-primary">編集</a>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</body>

</html>
