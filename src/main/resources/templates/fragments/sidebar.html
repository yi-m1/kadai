<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

	<div th:fragment="sidebar">

		<button id="hamburgerBtn" class="hamburger-btn">
			☰
		</button>

		<nav id="sidebar" class="sidebar">

			<div class="sidebar-user" th:if="${loginUser != null}">
				<span class="user-name" th:text="${loginUser.userName}">
					userName
				</span>
			</div>

			<div class="sidebar-user" th:unless="${loginUser != null}">
				<span class="user-label">未ログイン</span>
			</div>

			<hr />

			<ul class="sidebar-menu">

				<li th:classappend="${activeMenu == 'home'} ? 'active'" th:if="${loginUser != null}">
					<a th:href="@{/}">トップ</a>
				</li>

				<li th:if="${loginUser != null}" th:classappend="${activeMenu == 'janken'} ? 'active'">
					<a th:href="@{/janken}">じゃんけん</a>
				</li>

				<li th:if="${loginUser != null}" th:classappend="${activeMenu == 'lookoverthere'} ? 'active'">
					<a th:href="@{/lookoverthere/play}">あっちむいてほい</a>
				</li>

				<li th:if="${loginUser != null}" th:classappend="${activeMenu == 'history'} ? 'active'">
					<a th:href="@{/history}">対戦履歴</a>
				</li>

				<li th:if="${loginUser != null}">
					<form th:action="@{/logout}" method="post" style="display:inline;">
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
						<button type="submit" onclick="return confirm('ログアウトしますか？')">
							ログアウト
						</button>
					</form>
				</li>


			</ul>

		</nav>

	</div>

</body>

</html>
