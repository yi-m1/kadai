spring.application.name=janken_game

#アプリケーションのポート番号
server.port=8080

#HSQLDBデータベース設定
spring.datasource.url=jdbc:hsqldb:hsql://localhost/jankendb
spring.datasource.driverClassName=org.hsqldb.jdbc.JDBCDriver
spring.datasource.username=SS3
spring.datasource.password=ss3
spring.jpa.database-platform=org.hibernate.dialect.HSQLDialect

mybatis.type-aliases-package=entity
mybatis.mapper-locations=classpath:/mapper/**/*.xml
#スネークケースからキャメルケースに自動で調整
mybatis.configuration.map-underscore-to-camel-case=true

spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false